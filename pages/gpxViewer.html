<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>GPX Viewer</title>
  <link rel="stylesheet" href="../css/gpxProcessingStyle.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<div class="container">
  <h1>GPX Viewer</h1>
  <p>GPX-Datei laden, auf der Karte ansehen, Punkte umdrehen und herunterladen.</p>
  <input type="file" id="gpxFile" accept=".gpx">
  <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
    <button id="reverseBtn" disabled>Reverse Points</button>
    <button id="downloadBtn" disabled>Download (aktuelle Reihenfolge)</button>
    <button onclick="location.href='gpxProcessing.html'">Back to Processor</button>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/gpxViewer.js"></script>
</body>
</html>
